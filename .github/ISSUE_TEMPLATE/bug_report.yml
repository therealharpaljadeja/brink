name: Bug report
description: Report a reproducible Brink problem that is not a vulnerability
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not disclose vulnerabilities, private RPC credentials, or unrelated wallet data here; use the Security tab for vulnerabilities.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no private key, seed phrase, token, private RPC URL, or other secret.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Notch presentation
        - Settings or wallet management
        - Aave portfolio data
        - RPC or connectivity
        - Polling or lifecycle
        - Accessibility
        - Documentation or contributor tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest repeatable sequence. Redact wallet-sensitive information.
      placeholder: |
        1. Run Brink…
        2. Select…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include macOS, Mac model/notch status, Xcode, Brink commit, and whether the default RPC is used.
      placeholder: |
        macOS:
        Mac model/display:
        Xcode:
        Brink commit:
        Default or custom RPC:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove secrets, private RPC URLs, wallet addresses, balances, and personal information unless essential and yours to share.
